<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Northern Peaks Kitchen — Staff Live Order Screen &amp; Docket Printer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111813;
      --card-bg: #1B261F;
      --forest: #1C301E;
      --gold: #B89B67;
      --gold-light: #D5B882;
      --border: rgba(184, 155, 103, 0.35);
      --green: #27AE60;
      --red: #C0392B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Staff Header */
    header {
      background: #18231C;
      border-bottom: 2px solid var(--gold);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .brand-logo { height: 42px; width: auto; object-fit: contain; }
    .brand-title h1 { font-family: 'Oswald', sans-serif; font-size: 19px; color: var(--gold-light); letter-spacing: 0.8px; line-height: 1.1; }
    .brand-title p { font-size: 11px; color: #A0B2A6; font-weight: 600; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .live-clock {
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      color: #FFFFFF;
      background: rgba(255,255,255,0.06);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .toggle-autoprint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--gold-light);
      cursor: pointer;
      user-select: none;
    }
    .btn-test {
      background: var(--gold);
      color: #111813;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-test:hover { background: var(--gold-light); }

    /* Main Grid */
    .dashboard-container {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .stat-pill {
      background: #18231C;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-pill strong { font-family: 'Oswald', sans-serif; font-size: 16px; color: var(--gold-light); }

    .tickets-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .ticket {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      position: relative;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .ticket.ready {
      border-color: var(--green);
      background: #142E1F;
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 8px;
    }
    .ticket-id { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--gold-light); font-weight: 700; }
    .ticket-paid-tag {
      background: var(--green);
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }
    .ticket-time { font-size: 12px; color: #A0B2A6; }

    .ticket-cust {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .ticket-cust-phone { font-size: 12px; color: var(--gold-light); font-weight: 400; }

    .station-block {
      background: rgba(0,0,0,0.22);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .station-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
    }
    .tag-grill { background: #D35400; color: #fff; }
    .tag-barista { background: #2980B9; color: #fff; }

    .food-line { font-size: 14px; font-weight: 700; color: #FFFFFF; }
    .coffee-line { font-size: 13.5px; font-weight: 700; color: var(--gold-light); }
    .coffee-details { font-size: 12px; color: #D0DDD5; margin-left: 14px; }
    .item-note {
      font-size: 11.5px;
      color: #E67E22;
      font-style: italic;
      background: rgba(230,126,34,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .ticket-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px dashed rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ticket-price-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #A0B2A6;
    }
    .ticket-actions {
      display: flex;
      gap: 8px;
    }
    .btn-act {
      flex: 1;
      padding: 10px 6px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: all 0.15s ease;
    }
    .btn-print { background: #2C3E50; color: #FFFFFF; }
    .btn-print:hover { background: #34495E; }
    .btn-ready { background: var(--green); color: #FFFFFF; }
    .btn-ready:hover { background: #2ECC71; }
    .btn-done { background: #4A5B50; color: #FFFFFF; }
    .btn-done:hover { background: #5D7164; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #7C8E82;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }

    /* Thermal Print CSS */
    #printDocketArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printDocketArea, #printDocketArea * { visibility: visible; }
      #printDocketArea {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 78mm;
        margin: 0;
        padding: 4mm 2mm;
        font-family: 'Roboto Mono', Courier, monospace;
        font-size: 12px;
        line-height: 1.35;
        color: #000000;
        background: #FFFFFF;
      }
      .docket-header { text-align: center; margin-bottom: 8px; }
      .docket-header h2 { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
      .docket-header p { font-size: 11px; margin: 1px 0; }
      .docket-divider { border-top: 1px dashed #000; margin: 6px 0; }
      .docket-double-divider { border-top: 2px solid #000; margin: 6px 0; }
      .docket-row { display: flex; justify-content: space-between; }
      .docket-item { margin: 6px 0; }
      .docket-item-title { font-size: 13px; font-weight: 700; }
      .docket-item-sub { font-size: 11.5px; padding-left: 8px; }
      .docket-footer { text-align: center; margin-top: 10px; font-size: 11px; }
    }
  </style>
</head>

      <div class="brand-title">
        <h1>NORTHERN PEAKS KITCHEN</h1>
        <p>STAFF KITCHEN SCREEN &amp; DOCKET CONTROLLER</p>
      </div>
    </div>
    <div class="header-controls">
      <label class="toggle-autoprint">
        <input type="checkbox" id="autoPrintCheck" checked>
        <span>🖨️ Auto-Print to Docket Printer</span>
      </label>
      <div class="live-clock" id="liveClock">07:00 AM</div>
      <button class="btn-test" onclick="simulateTestPaidOrder()">+ Test Order Chime</button>
    </div>
  </header>

  <!-- Dashboard Body -->
  <div class="dashboard-container">
    <div class="stats-bar">
      <div class="stat-pill">Active Kitchen Orders: <strong id="activeCount">0</strong></div>
      <div class="stat-pill">Ready for Pickup: <strong id="readyCount" style="color:#2ECC71;">0</strong></div>
      <div class="stat-pill">Completed Today: <strong id="doneCount">0</strong></div>
      <div style="margin-left:auto; font-size:12px; color:#A0B2A6;">
        💡 <em>This screen is for staff only. Keep open on counter iPad or POS monitor.</em>
      </div>
    </div>

    <div class="tickets-grid" id="ticketsGrid">
      <!-- Injected by JavaScript -->
    </div>
  </div>

  <script>
    // Live Clock
    setInterval(() => {
      const d = new Date();
      document.getElementById('liveClock').innerText = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    }, 1000);

    // Audio Synthesizer (Staff Bell Chime)
    function playKitchenChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880.00, now + 0.12); // A5
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) {}
    }

    // Real-Time Cross-Tab / Cross-Window Listener
    try {
      const bc = new BroadcastChannel('np_kitchen_channel');
      bc.onmessage = (event) => {
        if (event.data && event.data.type === 'NEW_ORDER') {
          playKitchenChime();
          renderTickets();
          if (document.getElementById('autoPrintCheck').checked) {
            triggerThermalDocketPrint(event.data.order);
          }
        }
      };
    } catch(e) {}

    // Also listen to window localStorage changes
    window.addEventListener('storage', (e) => {
      if (e.key === 'np_orders') {
        playKitchenChime();
        renderTickets();
      }
    });

    // Render Tickets
    function renderTickets() {
      const grid = document.getElementById('ticketsGrid');
      const orders = JSON.parse(localStorage.getItem('np_orders') || '[]');

      let active = 0, ready = 0;
      orders.forEach(o => {
        if (o.status === 'preparing') active++;
        if (o.status === 'ready') ready++;
      });

      document.getElementById('activeCount').innerText = active;
      document.getElementById('readyCount').innerText = ready;
      document.getElementById('doneCount').innerText = parseInt(localStorage.getItem('np_done_count') || '0');

      if (orders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">☕🥪</div>
            <h3 style="font-family:'Oswald',sans-serif; font-size:22px; color:var(--gold-light);">Kitchen Screen Active &amp; Ready</h3>
            <p style="font-size:13px; margin-top:6px;">Waiting for new incoming paid Grab &amp; Go orders...</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = '';
      orders.forEach((o, idx) => {
        const ticket = document.createElement('div');
        ticket.className = `ticket ${o.status === 'ready' ? 'ready' : ''}`;

        let stationsHtml = o.items.map(it => `
          <div class="station-block">
            <span class="station-title tag-grill">🥪 GRILL &amp; TOASTIE STATION</span>
            <div class="food-line">• ${it.food}</div>
            ${it.note ? `<div class="item-note">Special Request: "${it.note}"</div>` : ''}
            
            <div style="margin-top:6px; padding-top:6px; border-top:1px dashed rgba(255,255,255,0.1);">
              <span class="station-title tag-barista">☕ BARISTA STATION</span>
              <div class="coffee-line">1x ${it.coffee} (${it.size})</div>
              <div class="coffee-details">🥛 ${it.milk} • ${it.sugar}${it.extraShot ? ' • Extra Shot' : ''}</div>
            </div>
          </div>
        `).join('');

        ticket.innerHTML = `
          <div class="ticket-header">
            <div>
              <span class="ticket-id">#${o.id}</span>
              <span class="ticket-paid-tag">PAID ✓</span>
            </div>
            <div class="ticket-time">${o.time} (${o.pickupTime})</div>
          </div>

          <div class="ticket-cust">
            <span>Customer: ${o.name}</span>
            <span class="ticket-cust-phone">📞 ${o.phone}</span>
          </div>

          <div>${stationsHtml}</div>

          <div class="ticket-footer">
            <div class="ticket-price-row">
              <span>Total: <strong>$${o.total.toFixed(2)}</strong></span>
              <span>${o.payment} (${o.authRef || 'VERIFIED'})</span>
            </div>
            <div class="ticket-actions">
              <button class="btn-act btn-print" onclick="reprintTicket(${idx})">🖨️ Re-Print</button>
              ${o.status === 'preparing' 
                ? `<button class="btn-act btn-ready" onclick="markOrderReady(${idx})">Mark Ready 🔔</button>`
                : `<button class="btn-act" style="background:#2ECC71; color:#fff;" disabled>Ready at Counter ✓</button>`
              }
              <button class="btn-act btn-done" onclick="completeOrder(${idx})">Done ✅</button>
            </div>
          </div>
        `;
        grid.appendChild(ticket);
      });
    }

    function markOrderReady(idx) {
      let orders = JSON.parse(localStorage.getItem('np_orders') || '[]');
      if (orders[idx]) {
        orders[idx].status = 'ready';
        localStorage.setItem('np_orders', JSON.stringify(orders));
        playKitchenChime();
        renderTickets();
      }
    }

    function completeOrder(idx) {
      let orders = JSON.parse(localStorage.getItem('np_orders') || '[]');
      orders.splice(idx, 1);
      localStorage.setItem('np_orders', JSON.stringify(orders));
      let done = parseInt(localStorage.getItem('np_done_count') || '0') + 1;
      localStorage.setItem('np_done_count', done);
      renderTickets();
    }

    function reprintTicket(idx) {
      let orders = JSON.parse(localStorage.getItem('np_orders') || '[]');
      if (orders[idx]) {
        triggerThermalDocketPrint(orders[idx]);
      }
    }

    // Thermal Docket Print Function
    function triggerThermalDocketPrint(order) {
      const docketArea = document.getElementById('printDocketArea');
      let itemsHtml = order.items.map(it => `
        <div class="docket-item">
          <div class="docket-row">
            <span class="docket-item-title">1x ${it.food.toUpperCase()}</span>
            <span>$${it.price.toFixed(2)}</span>
          </div>
          <div class="docket-item-sub">☕ ${it.coffee.toUpperCase()} (${it.size})</div>
          <div class="docket-item-sub">🥛 ${it.milk.toUpperCase()} | ${it.sugar.toUpperCase()}${it.extraShot ? ' | EXTRA SHOT' : ''}</div>
          ${it.note ? `<div class="docket-item-sub" style="font-weight:bold;">NOTE: "${it.note.toUpperCase()}"</div>` : ''}
        </div>
      `).join('');

      docketArea.innerHTML = `
        <div class="docket-header">
          <h2>NORTHERN PEAKS KITCHEN</h2>
          <p>GRAB &amp; GO EXPRESS</p>
          <p>Shop 2, 9 Westralia St, Stuart Park</p>
          <p>Darwin, NT 0820 • 0424 203 924</p>
        </div>
        <div class="docket-double-divider"></div>
        <div class="docket-row">
          <strong>ORDER #: ${order.id}</strong>
          <strong style="border:1px solid #000; padding:1px 4px;">*** PAID ***</strong>
        </div>
        <div class="docket-row">
          <span>TIME: ${order.time}</span>
          <span>DATE: ${order.date || new Date().toLocaleDateString('en-AU')}</span>
        </div>
        <div class="docket-row">
          <strong>CUSTOMER: ${order.name.toUpperCase()}</strong>
          <span>${order.phone}</span>
        </div>
        <div class="docket-row">
          <span>PICKUP: ${order.pickupTime.toUpperCase()}</span>
        </div>
        <div class="docket-divider"></div>
        <div>${itemsHtml}</div>
        <div class="docket-divider"></div>
        <div class="docket-row" style="font-size:14px; font-weight:700;">
          <span>TOTAL (GST INCL):</span>
          <span>$${order.total.toFixed(2)}</span>
        </div>
        <div class="docket-row" style="font-size:11px; margin-top:2px;">
          <span>PAYMENT METHOD:</span>
          <span>${order.payment}</span>
        </div>
        <div class="docket-row" style="font-size:10px;">
          <span>AUTH CODE:</span>
          <span>${order.authRef || 'VERIFIED'}</span>
        </div>
        <div class="docket-double-divider"></div>
        <div class="docket-footer">
          <p style="font-weight:700; font-size:12px;">*** TOASTIE PRESS &amp; BARISTA DOCKET ***</p>
          <p>Ready for customer express collection</p>
          <p>www.northernpeaks.com.au</p>
        </div>
      `;

      setTimeout(() => {
        window.print();
      }, 300);
    }

    function simulateTestPaidOrder() {
      const sample = {
        id: 'NP-' + Math.floor(100 + Math.random() * 900),
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        date: new Date().toLocaleDateString('en-AU'),
        name: "Sarah (Local Office)",
        phone: "0412 999 888",
        pickupTime: "5–10 mins (ASAP)",
        payment: "Apple Pay (PAID)",
        authRef: "AUTH-892144",
        items: [
          { food: "Chicken & Avocado Toastie", coffee: "Caffè Latte", size: "8oz Regular", milk: "Oat Milk (+ $1.00)", sugar: "1 Sugar", extraShot: false, note: "Extra hot please", price: 15.50 }
        ],
        total: 15.50,
        status: "preparing"
      };
      let orders = JSON.parse(localStorage.getItem('np_orders') || '[]');
      orders.unshift(sample);
      localStorage.setItem('np_orders', JSON.stringify(orders));
      playKitchenChime();
      renderTickets();

      if (document.getElementById('autoPrintCheck').checked) {
        triggerThermalDocketPrint(sample);
      }
    }

    // Initial load
    renderTickets();
  </script>
</body>
</html>
